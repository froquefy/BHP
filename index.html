:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141513;
  --surface: #1e1f1c;
  --surface-2: #2a2b27;
  --text: #ebeae4;
  --muted: #a2a198;
  --border: #353630;
  --accent: #85a3ff;
  --on-accent: #0c1222;
  --ok: #52c487;
  --on-ok: #0b1a11;
  --ok-bg: #173023;
  --bad: #ff7b6f;
  --on-bad: #22100e;
  --bad-bg: #3a1d1a;
  --warn: #f0b153;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--pattern);
  background-size: 240px 240px;
  color: var(--text);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }

/* Header */
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0; }
.logo {
  flex: 0 0 46px; height: 46px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center;
}
.logo svg { width: 36px; height: auto; display: block; }
h1 { font-size: 1.12rem; margin: 0; line-height: 1.2; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: .84rem; }
.tabs { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; }
.tabs button {
  border: 0; background: transparent; color: var(--muted);
  padding: 6px 13px; border-radius: 8px; font-size: .9rem; cursor: pointer;
}
.tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 600; }
.iconbtn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--text);
}
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 18px; height: 18px; }
:root[data-theme="pink"] .iconbtn { color: var(--accent); }

/* Overall progress */
.overall { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; font-size: .84rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; width: 0; transition: width .35s ease; }
.bar > i.k { background: var(--ok); }
.bar > i.l { background: var(--warn); }
.bar > i.s { background: var(--accent); }
.overall b { color: var(--text); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-top: 12px; }
details.panel > summary {
  padding: 12px 16px; cursor: pointer; font-weight: 600; list-style: none;
  display: flex; align-items: center; gap: 10px;
}
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform .2s; }
details.panel[open] > summary::after { transform: rotate(180deg); }
.sumtxt { font-weight: 400; color: var(--muted); font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.settings { padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
.settings .full { grid-column: 1 / -1; }
.range { display: flex; align-items: center; gap: 8px; }
.range input { flex: 1; min-width: 0; }
select, input[type=number], input[type=search] {
  width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: .95rem;
}
label.check { flex-direction: row; align-items: center; gap: 8px; font-size: .9rem; color: var(--text); cursor: pointer; }
label.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.settings-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.match { color: var(--muted); font-size: .85rem; }

/* Session bar */
.sessbar { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: .85rem; color: var(--muted); }
.sessbar .bar { height: 6px; }
.sessbar .okc { color: var(--ok); font-weight: 600; }
.sessbar .badc { color: var(--bad); font-weight: 600; }

/* Card */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  padding: 22px; box-shadow: var(--shadow); margin-top: 10px;
}
.card.flip:not(.revealed) { cursor: pointer; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
.num { font-weight: 700; color: var(--text); }
.chip { background: var(--surface-2); padding: 2px 10px; border-radius: 99px; }
.st { display: inline-flex; align-items: center; gap: 5px; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.st-known::before { background: var(--ok); }
.st-learn::before { background: var(--warn); }
.st-new::before { background: var(--border); border: 1px solid var(--muted); }
.qtext { font-size: 1.2rem; line-height: 1.45; margin: 0 0 18px; font-weight: 650; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--text); cursor: pointer; line-height: 1.45;
  transition: border-color .15s, background-color .15s, opacity .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; color: var(--text); }
.letter {
  flex: 0 0 28px; height: 28px; border-radius: 8px; background: var(--surface-2);
  display: grid; place-items: center; font-weight: 700; font-size: .85rem;
}
.otext { padding-top: 2px; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .letter { background: var(--ok); color: var(--on-ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .letter { background: var(--bad); color: var(--on-bad); }
.opt.dim { opacity: .5; }
.verdict { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-weight: 600; }
.verdict.v-ok { background: var(--ok-bg); color: var(--ok); }
.verdict.v-bad { background: var(--bad-bg); color: var(--bad); }
.tap { color: var(--muted); font-size: .9rem; text-align: center; padding: 18px 0 4px; border-top: 1px dashed var(--border); }
.answer { border-left: 4px solid var(--ok); background: var(--ok-bg); padding: 12px 16px; border-radius: 10px; }
.alabel { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.answer .alabel { color: var(--ok); }
.answer p { margin: 4px 0 0; font-weight: 600; font-size: 1.05rem; }
.others { margin-top: 14px; }
.others ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: .92rem; }
.others li { margin: 3px 0; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }

/* Buttons */
.actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.btn {
  flex: 1 1 160px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { border-color: var(--accent); }
.btn.small { flex: 0 0 auto; padding: 9px 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.btn.ghost { flex: 0 0 auto; background: transparent; color: var(--muted); }
kbd {
  font: 600 .7rem/1 ui-monospace, Consolas, monospace; padding: 3px 5px; border-radius: 5px;
  border: 1px solid currentColor; opacity: .7;
}
.hint { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 18px; }
@media (hover: none) { kbd, .hint { display: none; } }

/* End screen */
.end { text-align: center; padding: 32px 22px; }
.end h2 { margin: 6px 0 8px; }
.end p { color: var(--muted); margin: 6px 0; }
.big { font-size: 2.4rem; line-height: 1; }

/* List */
.tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: 10px; margin-top: 14px; }
.tools .check { grid-column: 1 / -1; }
.count { color: var(--muted); font-size: .85rem; margin: 10px 2px; }
ol.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.li { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.li .lq { margin: 6px 0 8px; font-weight: 600; }
.li .la { margin: 0; display: flex; gap: 10px; align-items: flex-start; }
.li .la .letter { background: var(--ok); color: var(--on-ok); flex-basis: 24px; height: 24px; font-size: .75rem; }
.li .lw { margin: 8px 0 0; display: grid; gap: 4px; padding: 0; list-style: none; color: var(--muted); font-size: .92rem; }
.li .lw li { display: flex; gap: 10px; }
.li .lw .letter { flex-basis: 24px; height: 24px; font-size: .75rem; }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.more { display: block; margin: 12px auto 0; }

/* Stats */
.stats-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.tile .v { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.tile .k { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.tile.t-k .k::before { background: var(--ok); }
.tile.t-l .k::before { background: var(--warn); }
.tile.t-n .k::before { border: 1px solid var(--muted); }
.secs { display: grid; gap: 8px; margin-top: 12px; }
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.sec .name { font-weight: 600; }
.sec .nums { color: var(--muted); font-size: .82rem; }
.sec .bar { grid-column: 1 / 2; }
.sec .btn { grid-row: 1 / 3; grid-column: 2; }
.danger { margin-top: 20px; text-align: center; }
.linkbtn { background: none; border: 0; color: var(--bad); cursor: pointer; text-decoration: underline; font-size: .85rem; }

@media (max-width: 560px) {
  .settings { grid-template-columns: minmax(0, 1fr); }
  .tools { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px 16px; }
  .qtext { font-size: 1.1rem; }
  .tabs { flex: 1 1 auto; }
  .tabs button { flex: 1; padding: 6px 8px; }
  .stats-head .tile .v { font-size: 1.3rem; }
}
</style>

być wykonywana zdalnie:",["praca związana ze stosowaniem szkodliwych czynników biologicznych","praca biurowa","wszystkie odpowiedzi są prawidłowe"],0],[387,15,"Oględzin miejsca wypadku przy pracy zdalnej dokonuje się:",["w terminie wskazanym przez pracownika","w terminie wskazanym przez członków zespołu powypadkowego","w terminie uzgodnionym przez pracownika i członków zespołu powypadkowego"],2],[388,15,"Pracodawca jest obowiązany skierować nowo przyjmowanego pracownika na wstępne badania lekarskie:",["niezwłocznie po zatrudnieniu","nie później niż do zakończenia okresu próbnego","przed dopuszczeniem do pracy"],2],[389,15,"Masa przedmiotu podnoszonego i przenoszonego ręcznie przez pracownicę w ciąży nie może przekraczać:",["1 kg","3 kg","5 kg"],1],[390,15,"Do kogo należy pranie oraz konserwacja odzieży i obuwia roboczego, które w wyniku stosowania w procesie pracy ulegną skażeniu środkami chemicznymi, promieniowaniu lub materiałami biologicznymi?",["do pracownika, pod warunkiem wypłacenia przez pracodawcę ekwiwalentu pieniężnego w wysokości kosztów poniesionych przez pracownika","do pracownika, po dostarczeniu mu przez pracodawcę odpowiednich środków piorących","do pracodawcy"],2],[391,15,"Wyposażanie stanowisk pracy w maszyny i inne urządzenia techniczne, które nie spełniają wymagań, dotyczących oceny zgodności z dyrektywami Unii Europejskiej jest:",["dopuszczalne, jeśli pracodawca wyrazi na to pisemną zgodę","dopuszczalne, po przeprowadzeniu odbioru maszyn i innych urządzeń technicznych przez konserwatora","niedopuszczalne"],2],[392,15,"Czy pracodawca ma obowiązek wyznaczenia osób do udzielania pierwszej pomocy?",["tak, pracodawca, który zatrudnia 50 osób","tak, pracodawca, który zatrudnia powyżej 100 osób","tak, każdy pracodawca ma taki obowiązek"],2],[393,15,"Stosowanie substancji niebezpiecznej, mieszaniny niebezpiecznej, substancji stwarzającej zagrożenie lub mieszaniny stwarzającej zagrożenie jest dopuszczalne pod warunkiem:",["zastosowania środków zapewniają const SECTIONS = DATA.sections;
const Q = DATA.q.map(([n, s, q, o, a]) => ({ n, s, q, o, a }));
const byN = new Map(Q.map(x => [x.n, x]));
const MAXN = Q[Q.length - 1].n;
const L = 'ABCD';
const $ = s => document.querySelector(s);

const store = {
  get(k, d) { try { const v = localStorage.getItem('bhp-fiszki:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bhp-fiszki:' + k, JSON.stringify(v)); } catch (e) {} }
};

let prog = store.get('prog', {});          // n -> { k: opanowane?, c: ile razy dobrze, w: ile razy źle }
const DEF = { sec: '', from: 1, to: MAXN, pool: 'todo', order: 'seq', mode: 'quiz', shuf: false };
let cfg = Object.assign({}, DEF, store.get('cfg', {}));
let sess = store.get('sess', null);        // { queue, total, ok, bad, first, seen, wrong }
let cur = null;                            // bieżąca karta

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const status = n => { const p = prog[n]; return !p ? 'new' : p.k ? 'known' : 'learn'; };
const STATUS_LABEL = { new: 'nowe', learn: 'do powtórki', known: 'opanowane' };
const save = () => { store.set('prog', prog); store.set('sess', sess); store.set('cfg', cfg); };
const plural = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;

// tekst do wyszukiwania: bez HTML i bez polskich znaków
const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
Q.forEach(x => { x.search = norm(x.n + '. ' + plain(x.q) + ' ' + x.o.map(plain).join(' ')); });

const secRange = i => { const c = Q.filter(x => x.s === i); return [c[0].n, c[c.length - 1].n]; };
const secOptions = () => '<option value="">Wszystkie działy</option>' +
  SECTIONS.map((s, i) => { const [a, b] = secRange(i); return `<option value="${i}">${s} (${a}–${b})</option>`; }).join('');

/* ---------- Postęp ogólny ---------- */
function renderOverall() {
  let k = 0, l = 0;
  Q.forEach(x => { const s = status(x.n); if (s === 'known') k++; else if (s === 'learn') l++; });
  $('#ovK').style.width = (k / Q.length * 100) + '%';
  $('#ovL').style.width = (l / Q.length * 100) + '%';
  $('#ovTxt').innerHTML = `opanowane <b>${k}</b> / ${Q.length}` + (l ? ` · do powtórki <b>${l}</b>` : '');
}

/* ---------- Ustawienia ---------- */
function buildPool(c) {
  let list = Q.filter(x => (c.sec === '' || x.s === +c.sec) && x.n >= c.from && x.n <= c.to);
  if (c.pool === 'todo') list = list.filter(x => status(x.n) !== 'known');
  if (c.pool === 'wrong') list = list.filter(x => prog[x.n] && prog[x.n].w > 0);
  if (c.pool === 'new') list = list.filter(x => status(x.n) === 'new');
  const ns = list.map(x => x.n);
  return c.order === 'rand' ? shuffle(ns) : ns;
}

function readForm() {
  let from = parseInt($('#fFrom').value, 10), to = parseInt($('#fTo').value, 10);
  if (!(from >= 1)) from = 1;
  if (!(to >= 1)) to = MAXN;
  from = Math.min(from, MAXN); to = Math.min(to, MAXN);
  if (from > to) [from, to] = [to, from];
  return { sec: $('#fSec').value, from, to, pool: $('#fPool').value, order: $('#fOrder').value, mode: $('#fMode').value, shuf: $('#fShuf').checked };
}

function fillForm() {
  $('#fSec').value = cfg.sec; $('#fFrom').value = cfg.from; $('#fTo').value = cfg.to;
  $('#fPool').value = cfg.pool; $('#fOrder').value = cfg.order; $('#fMode').value = cfg.mode; $('#fShuf').checked = cfg.shuf;
  updateMatch(); updateSummary();
}

function updateMatch() {
  const n = buildPool(readForm()).length;
  $('#matchTxt').textContent = `Pasuje: ${n} ${plural(n, 'pytanie', 'pytania', 'pytań')}`;
}

function updateSummary() {
  const pools = { todo: 'nieopanowane', all: 'wszystkie', wrong: 'z pomyłkami', new: 'nowe' };
  const parts = [cfg.sec === '' ? 'wszystkie działy' : SECTIONS[+cfg.sec]];
  if (cfg.from !== 1 || cfg.to !== MAXN) parts.push(`pyt. ${cfg.from}–${cfg.to}`);
  parts.push(pools[cfg.pool], cfg.order === 'rand' ? 'losowo' : 'po kolei', cfg.mode === 'quiz' ? 'test' : 'fiszki');
  $('#sumTxt').textContent = '· ' + parts.join(' · ');
}

/* ---------- Sesja ---------- */
function startSession(ns) {
  sess = { queue: ns, total: ns.length, ok: 0, bad: 0, first: 0, seen: [], wrong: [] };
  save(); updateSummary(); showCard();
}

function renderSessBar() {
  const el = $('#sessbar');
  if (!sess || !sess.total) { el.innerHTML = ''; return; }
  const left = new Set(sess.queue).size, done = sess.total - left;
  el.innerHTML = `<span>Sesja: <b>${done}</b> / ${sess.total}</span>` +
    `<div class="bar"><i class="s" style="width:${done / sess.total * 100}%"></i></div>` +
    `<span class="okc" title="Dobrze">✓ ${sess.ok}</span><span class="badc" title="Źle">✕ ${sess.bad}</span>`;
}

function showCard() {
  const box = $('#card');
  renderSessBar();
  if (!sess || !sess.queue.length) { cur = null; renderEnd(); return; }
  const q = byN.get(sess.queue[0]);
  cur = { q, perm: cfg.shuf ? shuffle([0, 1, 2]) : [0, 1, 2], revealed: false, picked: null, result: null };
  const st = status(q.n);
  box.className = 'card' + (cfg.mode === 'flip' ? ' flip' : '');
  let h = `<div class="meta"><span class="num">Pytanie ${q.n}</span><span class="chip">${SECTIONS[q.s]}</span>` +
          `<span class="st st-${st}">${STATUS_LABEL[st]}</span></div><h2 class="qtext">${q.q}</h2>`;
  if (cfg.mode === 'quiz') {
    h += '<div class="opts">' + cur.perm.map((oi, di) =>
      `<button class="opt" data-d="${di}"><span class="letter">${L[di]}</span><span class="otext">${q.o[oi]}</span></button>`).join('') + '</div>';
    h += '<div class="verdict" hidden></div>';
  } else {
    h += '<div class="tap">Pomyśl, jaka jest odpowiedź — potem kliknij kartę</div><div class="answer" hidden></div>';
  }
  box.innerHTML = h;
  renderActions();
}

function renderActions() {
  const a = $('#actions');
  if (!cur) return;
  if (!cur.revealed) {
    a.innerHTML = `<button class="btn" data-act="reveal">${cfg.mode === 'quiz' ? 'Nie wiem — pokaż' : 'Pokaż odpowiedź'} <kbd>Spacja</kbd></button>` +
                  `<button class="btn ghost" data-act="skip" title="Odłóż na koniec kolejki">Pomiń</button>`;
  } else if (cur.picked !== null) {
    a.innerHTML = (cur.result ? `<button class="btn ghost" data-act="guess" title="Zaliczy jako pomyłkę i wróci za chwilę">To był strzał — powtórz</button>` : '') +
                  `<button class="btn primary" data-act="next">Dalej <kbd>Enter</kbd></button>`;
  } else {
    a.innerHTML = `<button class="btn bad" data-act="no">Nie umiem <kbd>N</kbd></button><button class="btn ok" data-act="yes">Umiem <kbd>U</kbd></button>`;
  }
}

function pick(di) {
  if (!cur || cur.revealed || cfg.mode !== 'quiz') return;
  cur.picked = di;
  cur.result = cur.perm[di] === cur.q.a;
  reveal();
}

function reveal() {
  if (!cur || cur.revealed) return;
  cur.revealed = true;
  const q = cur.q, card = $('#card');
  card.classList.add('revealed');
  if (cfg.mode === 'quiz') {
    card.querySelectorAll('.opt').forEach(b => {
      const di = +b.dataset.d, oi = cur.perm[di];
      b.classList.add(oi === q.a ? 'correct' : di === cur.picked ? 'wrong' : 'dim');
      b.disabled = true;
    });
    if (cur.picked !== null) {
      const v = card.querySelector('.verdict');
      v.hidden = false;
      v.className = 'verdict ' + (cur.result ? 'v-ok' : 'v-bad');
      v.textContent = cur.result ? 'Dobrze!' : `Źle — poprawna odpowiedź to ${L[cur.perm.indexOf(q.a)]}.`;
    }
  } else {
    card.querySelector('.tap').remove();
    const ans = card.querySelector('.answer');
    ans.hidden = false;
    ans.innerHTML = `<div class="alabel">Poprawna odpowiedź (${L[q.a]})</div><p>${q.o[q.a]}</p>`;
    ans.insertAdjacentHTML('afterend', `<div class="others"><div class="alabel">Błędne warianty</div><ul>` +
      q.o.map((t, i) => i === q.a ? '' : `<li>${L[i]}) ${t}</li>`).join('') + '</ul></div>');
  }
  renderActions();
}

function grade(known) {
  if (!cur) return;
  const n = cur.q.n;
  const p = prog[n] || (prog[n] = { k: false, c: 0, w: 0 });
  const first = !sess.seen.includes(n);
  if (first) sess.seen.push(n);
  sess.queue.shift();
  if (known) {
    p.c++; p.k = true; sess.ok++;
    if (first) sess.first++;
  } else {
    p.w++; p.k = false; sess.bad++;
    if (!sess.wrong.includes(n)) sess.wrong.push(n);
    // wraca za kilka kart
    const pos = Math.min(sess.queue.length, 3 + Math.floor(Math.random() * 3));
    sess.queue.splice(pos, 0, n);
  }
  save(); renderOverall(); showCard();
}

function next() { if (cur && cur.revealed && cur.picked !== null) grade(cur.result); }
function skip() { if (!cur) return; sess.queue.push(sess.queue.shift()); save(); showCard(); }

function renderEnd() {
  const box = $('#card'), a = $('#actions');
  box.className = 'card end';
  if (!sess || !sess.total) {
    box.innerHTML = `<div class="big">🤷</div><h2>Brak pytań dla tych ustawień</h2>` +
      `<p>${cfg.pool === 'todo' ? 'Wszystko w tym zakresie jest już opanowane 🎉 ' : ''}Zmień ustawienia sesji — np. „Które pytania” → „Wszystkie”.</p>`;
    a.innerHTML = `<button class="btn primary" data-act="settings">Otwórz ustawienia</button>`;
    return;
  }
  const pct = Math.round(sess.first / sess.total * 100);
  box.innerHTML = `<div class="big">${pct >= 90 ? '🏆' : pct >= 60 ? '🎉' : '💪'}</div><h2>Sesja ukończona</h2>` +
    `<p>Dobrze za pierwszym razem: <b>${sess.first}</b> z ${sess.total} (${pct}%)</p>` +
    (sess.wrong.length ? `<p>Pomyłki w tej sesji: ${sess.wrong.length} ${plural(sess.wrong.length, 'pytanie', 'pytania', 'pytań')} — warto je przerobić jeszcze raz.</p>` : '<p>Bez ani jednej pomyłki!</p>');
  a.innerHTML = (sess.wrong.length ? `<button class="btn primary" data-act="again">Powtórz pomyłki (${sess.wrong.length})</button>` : '') +
    `<button class="btn${sess.wrong.length ? '' : ' primary'}" data-act="fresh">Nowa sesja</button>`;
}

const ACTIONS = {
  reveal, skip, next,
  guess: () => grade(false),
  yes: () => grade(true),
  no: () => grade(false),
  again: () => { const w = sess.wrong.slice(); startSession(cfg.order === 'rand' ? shuffle(w) : w.sort((a, b) => a - b)); },
  fresh: () => startSession(buildPool(cfg)),
  settings: () => { $('#settings').open = true; $('#settings').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
};

$('#actions').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  b.blur();
  ACTIONS[b.dataset.act]?.();
});

$('#card').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (b) { if (!b.disabled) { b.blur(); pick(+b.dataset.d); } return; }
  if (cfg.mode === 'flip' && cur && !cur.revealed) reveal();
});

$('#startBtn').addEventListener('click', () => {
  cfg = readForm();
  fillForm();
  startSession(buildPool(cfg));
  $('#settings').open = false;
});

['#fSec', '#fFrom', '#fTo', '#fPool', '#fOrder'].forEach(s => $(s).addEventListener('input', updateMatch));
$('#fSec').addEventListener('change', () => {
  // wybór działu ustawia zakres numerów na ten dział
  const v = $('#fSec').value;
  const [a, b] = v === '' ? [1, MAXN] : secRange(+v);
  $('#fFrom').value = a; $('#fTo').value = b;
  updateMatch();
});
// tryb i mieszanie działają od razu, bez nowej sesji
['#fMode', '#fShuf'].forEach(s => $(s).addEventListener('change', () => {
  cfg.mode = $('#fMode').value; cfg.shuf = $('#fShuf').checked;
  save(); updateSummary();
  if (cur && !cur.revealed) showCard();
}));

document.addEventListener('keydown', e => {
  if (view !== 'learn' || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target instanceof Element ? e.target : document.body;
  if (t.closest('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (t.closest('summary') && (k === ' ' || k === 'enter')) return;
  let handled = true;
  if (!cur) {
    if (k === 'enter') { const b = $('#actions .btn.primary'); if (b) b.click(); } else handled = false;
  } else if (!cur.revealed) {
    const idx = { '1': 0, '2': 1, '3': 2, 'a': 0, 'b': 1, 'c': 2 }[k];
    if (idx !== undefined && cfg.mode === 'quiz') pick(idx);
    else if (k === ' ' || k === 'enter') reveal();
    else if (k === 'p') skip();
    else handled = false;
  } else if (cur.picked !== null) {
    if (k === 'enter' || k === ' ' || k === 'arrowright') next();
    else if (k === 'n' && cur.result) grade(false);
    else handled = false;
  } else {
    if (k === 'u' || k === 'arrowright') grade(true);
    else if (k === 'n' || k === 'arrowleft') grade(false);
    else handled = false;
  }
  if (handled) e.preventDefault();
});

/* ---------- Ściąga ---------- */
const LIST_PAGE = 60;
let listLimit = LIST_PAGE;
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function highlight(html, terms) {
  if (!terms.length) return html;
  // podświetlenie tylko w tekście (poza tagami), bez względu na polskie znaki
  return html.replace(/(^|>)([^<]+)/g, (m, p, text) => {
    const n = norm(text);
    const marks = [];
    terms.forEach(t => { let i = 0; while ((i = n.indexOf(t, i)) !== -1) { marks.push([i, i + t.length]); i += t.length; } });
    if (!marks.length) return m;
    marks.sort((x, y) => x[0] - y[0]);
    let out = '', pos = 0;
    marks.forEach(([s, e]) => { if (s < pos) return; out += text.slice(pos, s) + '<mark>' + text.slice(s, e) + '</mark>'; pos = e; });
    return p + out + text.slice(pos);
  });
}

function renderList() {
  const terms = norm($('#lSearch').value).split(/\s+/).filter(Boolean);
  const sec = $('#lSec').value, all = $('#lAll').checked;
  const hits = Q.filter(x => (sec === '' || x.s === +sec) && terms.every(t => x.search.includes(t)));
  $('#lCount').textContent = `${hits.length} ${plural(hits.length, 'pytanie', 'pytania', 'pytań')}`;
  const shown = hits.slice(0, listLimit);
  $('#list').innerHTML = shown.map(x => {
    const st = status(x.n);
    const wrong = all ? '<ul class="lw">' + x.o.map((t, i) => i === x.a ? '' : `<li><span class="letter">${L[i]}</span><span>${highlight(t, terms)}</span></li>`).join('') + '</ul>' : '';
    return `<li class="li"><div class="meta"><span class="num">${x.n}.</span><span class="chip">${SECTIONS[x.s]}</span><span class="st st-${st}">${STATUS_LABEL[st]}</span></div>` +
      `<p class="lq">${highlight(x.q, terms)}</p>` +
      `<p class="la"><span class="letter">${L[x.a]}</span><span>${highlight(x.o[x.a], terms)}</span></p>${wrong}</li>`;
  }).join('');
  const more = $('#lMore');
  more.hidden = hits.length <= listLimit;
  more.textContent = `Pokaż więcej (${hits.length - listLimit})`;
}
$('#lSearch').addEventListener('input', () => { listLimit = LIST_PAGE; renderList(); });
$('#lSec').addEventListener('change', () => { listLimit = LIST_PAGE; renderList(); });
$('#lAll').addEventListener('change', renderList);
$('#lMore').addEventListener('click', () => { listLimit += 120; renderList(); });

/* ---------- Postępy ---------- */
function renderStats() {
  const cnt = { known: 0, learn: 0, new: 0 };
  Q.forEach(x => cnt[status(x.n)]++);
  $('#stTiles').innerHTML =
    `<div class="tile t-k"><div class="v">${cnt.known}</div><div class="k">opanowane</div></div>` +
    `<div class="tile t-l"><div class="v">${cnt.learn}</div><div class="k">do powtórki</div></div>` +
    `<div class="tile t-n"><div class="v">${cnt.new}</div><div class="k">jeszcze nowe</div></div>`;
  $('#stSecs').innerHTML = SECTIONS.map((name, i) => {
    const qs = Q.filter(x => x.s === i);
    const k = qs.filter(x => status(x.n) === 'known').length, l = qs.filter(x => status(x.n) === 'learn').length;
    const [a, b] = secRange(i);
    return `<div class="sec"><div><span class="name">${name}</span> <span class="nums">· pyt. ${a}–${b} · ${k}/${qs.length} opanowane${l ? ` · ${l} do powtórki` : ''}</span></div>` +
      `<button class="btn small" data-sec="${i}">${k === qs.length ? 'Powtórz' : 'Ucz się'}</button>` +
      `<div class="bar"><i class="k" style="width:${k / qs.length * 100}%"></i><i class="l" style="width:${l / qs.length * 100}%"></i></div></div>`;
  }).join('');
}
$('#stSecs').addEventListener('click', e => {
  const b = e.target.closest('[data-sec]');
  if (!b) return;
  const i = +b.dataset.sec, [a, z] = secRange(i);
  const allKnown = Q.filter(x => x.s === i).every(x => status(x.n) === 'known');
  cfg = Object.assign({}, cfg, { sec: String(i), from: a, to: z, pool: allKnown ? 'all' : 'todo' });
  fillForm();
  startSession(buildPool(cfg));
  setView('learn');
});
let resetArmed = null;
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  // dwuetapowe potwierdzenie zamiast confirm(), które bywa zablokowane w osadzonych stronach
  if (!resetArmed) {
    b.textContent = 'Na pewno? Kliknij jeszcze raz, żeby wyzerować';
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = 'Wyzeruj wszystkie postępy'; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  b.textContent = 'Wyzeruj wszystkie postępy';
  prog = {}; sess = null; save();
  renderOverall(); renderStats();
  startSession(buildPool(cfg));
});

/* ---------- Widoki i motyw ---------- */
let view = 'learn';
function setView(v) {
  view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  ['learn', 'list', 'stats'].forEach(x => { $('#view-' + x).hidden = x !== v; });
  if (v === 'list') renderList();
  if (v === 'stats') renderStats();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

// jasny -> ciemny -> różowy -> jasny…; domyślnie różowy
const THEMES = ['light', 'dark', 'pink'];
const ico = body => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
const THEME_INFO = {
  light: ['jasny', ico('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')],
  dark: ['ciemny', ico('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>')],
  pink: ['różowy', ico('<path fill="currentColor" d="M12 20.5s-7.3-4.5-9.2-9C1.6 8.4 3.6 5 7 5c2 0 3.6 1.1 5 2.9C13.4 6.1 15 5 17 5c3.4 0 5.4 3.4 4.2 6.5-1.9 4.5-9.2 9-9.2 9z"/>')]
};
// nowy klucz, żeby wybór z wersji bez różowego motywu nie nadpisywał domyślnego różowego
let theme = store.get('motyw', 'pink');
const effTheme = () => theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const applyTheme = () => {
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  const [name, icon] = THEME_INFO[effTheme()];
  const b = $('#themeBtn');
  b.innerHTML = icon;
  b.title = `Motyw: ${name} — kliknij, żeby zmienić`;
  b.setAttribute('aria-label', b.title);
};
$('#themeBtn').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(effTheme()) + 1) % THEMES.length];
  store.set('motyw', theme); applyTheme();
});

/* ---------- Start ---------- */
applyTheme();
$('#totalQ').textContent = Q.length;
$('#fSec').innerHTML = secOptions();
$('#lSec').innerHTML = secOptions();
$('#fFrom').max = $('#fTo').max = MAXN;
fillForm();
renderOverall();
if (sess && Array.isArray(sess.queue)) showCard();
else startSession(buildPool(cfg));
</script>
</body>
